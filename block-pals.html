<meta charset="utf-8">
<title>Block Pals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: one full-height screen at a time; big colored "block" buttons with a thick bottom edge, voice does the instructing. Single bright look by choice. */
:root{
  --sky:#DCEFFF; --sky2:#BFE0FF; --ink:#1B2A55; --card:#FFFFFF; --muted:#5E6E9B;
  --red:#F2564B; --orange:#FF9A2E; --yellow:#FFC928; --green:#4CC152; --teal:#1FB6B6; --blue:#3D8BFF; --purple:#8E5BE8; --pink:#FF6FB1;
  --f-display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --f-emoji:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;
  --u:clamp(18px,5.4vmin,56px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden}
#app{height:100%;display:flex;flex-direction:column;gap:12px;max-width:1280px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}

.topbar{display:flex;align-items:center;gap:12px}
.round{width:clamp(54px,9vmin,92px);height:clamp(54px,9vmin,92px);border-radius:50%;background:var(--card);box-shadow:0 5px 0 var(--sky2);display:grid;place-items:center;flex:none}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sky2)}
.round svg{width:55%;height:55%}
.pips{flex:1;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.pip{width:clamp(14px,2.6vmin,22px);height:clamp(14px,2.6vmin,22px);border-radius:6px;background:#fff;border:3px solid var(--sky2)}
.pip.ok{background:var(--green);border-color:#2E8F34}
.pip.assist{background:var(--yellow);border-color:#C79A0B}
.pip.now{border-color:var(--ink);transform:scale(1.2)}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,2.4vmin,20px);padding-bottom:14px}
.tile{width:clamp(88px,25vmin,220px);height:clamp(88px,25vmin,220px);border-radius:24px;background:var(--c);box-shadow:0 8px 0 var(--cd);
  display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:clamp(40px,12vmin,110px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .12s}
.tile:active{transform:translateY(5px);box-shadow:0 3px 0 var(--cd)}
.tile.emoji{font-family:var(--f-emoji);font-size:clamp(48px,14vmin,130px);background:#fff;box-shadow:0 8px 0 var(--sky2);text-shadow:none;color:var(--ink)}
.tile.emoji:active{box-shadow:0 3px 0 var(--sky2)}
.tile.ok{background:var(--green);box-shadow:0 8px 0 #2E8F34;animation:pop .5s}
.tile.emoji.ok{background:#D6F6D4;outline:6px solid var(--green)}
.tile.wrong{opacity:.25;transform:scale(.9);animation:shake .4s}
.tile.hint{animation:hint .7s infinite alternate}
.tile.used{opacity:.2;pointer-events:none}
.tile.word{width:auto;min-width:clamp(110px,24vmin,200px);padding:0 clamp(14px,3vmin,28px);font-size:clamp(34px,9vmin,72px)}
.tile.sm{width:clamp(70px,19vmin,150px);height:clamp(70px,19vmin,150px);font-size:clamp(36px,10vmin,84px)}

.slots{display:flex;gap:12px}
.slot{width:clamp(70px,19vmin,150px);height:clamp(70px,19vmin,150px);border-radius:20px;border:5px dashed var(--sky2);background:#ffffff99;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:clamp(40px,11vmin,88px);color:#fff}
.slot.on{border-style:solid;border-color:transparent;background:var(--c);box-shadow:0 6px 0 var(--cd);animation:pop .4s}
.big-emoji{font-family:var(--f-emoji);font-size:clamp(70px,22vmin,220px);line-height:1}
.bubble{background:var(--card);border-radius:24px;padding:10px 20px;font-family:var(--f-display);font-weight:600;font-size:clamp(22px,5vmin,34px);box-shadow:0 5px 0 var(--sky2)}
.eq{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,10vmin,92px);display:flex;gap:.35em;align-items:center;justify-content:center;flex-wrap:wrap}
.eq .q{color:var(--purple)}
.objs{display:grid;justify-content:center;gap:clamp(8px,2vmin,16px)}
.groups,.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:clamp(8px,2vmin,16px)}
.groups>div{background:#fff;border-radius:16px;padding:8px;box-shadow:0 4px 0 var(--sky2)}
.seq{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.seq span{min-width:clamp(54px,13vmin,110px);padding:6px 10px;border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--sky2);font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8vmin,72px)}
.seq span.q{background:var(--yellow);box-shadow:0 4px 0 #C79A0B}
.obj{font-family:var(--f-emoji);font-size:clamp(34px,10vmin,84px);line-height:1;position:relative;padding:2px;border-radius:12px}
.obj.c{background:#fff}
.obj i{position:absolute;right:-4px;top:-8px;background:var(--ink);color:#fff;font:700 14px var(--f-display);border-radius:10px;padding:1px 6px;font-style:normal}
svg.stack{width:calc(var(--u)*var(--k,1));height:auto;overflow:visible}
svg.blk{width:clamp(90px,24vmin,230px);height:auto}
.eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
.mascot{animation:bob 2.4s ease-in-out infinite}

.home,.menu{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.btn-skip{font:700 15px var(--f-body);color:var(--muted);text-decoration:underline;padding:10px}
.buddy{position:relative;width:clamp(56px,10vmin,96px);flex:none;z-index:5}
.buddy svg{width:100%;height:auto;display:block}
.buddy.cheer{animation:cheer .9s ease}
.buddy.wobble{animation:wobble .6s ease}
.buddy.nudge{animation:nudge .9s ease 1}
@keyframes nudge{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(8px) scale(1.25) rotate(-8deg)}45%{transform:translateY(8px) scale(1.25) rotate(8deg)}70%{transform:translateY(8px) scale(1.25) rotate(-5deg)}}
.buddy.dance{animation:dance 1.4s ease}
.mascot.hop{animation:hop .7s ease}
.mascot.wobble{animation:wobble .6s ease}
.spark{position:absolute;left:50%;top:50%;font:normal 28px var(--f-emoji);pointer-events:none;animation:spark .9s ease-out forwards}
@keyframes cheer{0%{transform:scale(1)}25%{transform:translateY(10px) scale(1.5,.95)}50%{transform:translateY(34px) scale(1.8) rotate(-10deg)}75%{transform:translateY(34px) scale(1.8) rotate(10deg)}100%{transform:scale(1)}}
@keyframes dance{0%{transform:scale(1)}20%{transform:translateY(30px) scale(1.8) rotate(0)}60%{transform:translateY(30px) scale(1.9) rotate(360deg)}100%{transform:scale(1) rotate(720deg)}}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}80%{transform:rotate(-5deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-28px) rotate(-6deg)}60%{transform:translateY(0) rotate(6deg)}}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3);opacity:0}}
.tcv{width:min(60vmin,560px);aspect-ratio:1;background:#fff;border-radius:28px;box-shadow:0 8px 0 var(--sky2);touch-action:none;display:block}
.ptabs{display:flex;gap:8px;margin:4px 0 6px}
.ptab{padding:10px 20px;border-radius:12px;background:#fff;font-weight:800;color:var(--ink)}
.ptab.on{background:var(--blue);color:#fff}
.hmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.hm{border-radius:10px;padding:6px 0;text-align:center;display:flex;flex-direction:column;line-height:1.15}
.hm b{font:700 20px var(--f-display)}
.hm small{font-size:12px;color:inherit;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:14px;padding:4px 10px;font-weight:800}
.chip small{font-weight:700;opacity:.8}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--sky);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font:700 30px var(--f-display)}
.stat small{color:var(--muted)}
.tips{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
#copybox{width:100%;font:14px var(--f-body);border-radius:10px;border:2px solid var(--sky2);padding:8px;margin-top:8px;color:var(--ink);background:#fff;user-select:text;-webkit-user-select:text}
.breakscreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vmin,26px);text-align:center}
.bchar{transform-origin:50% 100%}
.bchar svg{width:clamp(100px,24vmin,220px);height:auto;display:block}
.breakscreen .bigplay{width:clamp(90px,18vmin,150px);height:clamp(90px,18vmin,150px);box-shadow:0 8px 0 #2E8F34}
.breakscreen .bigplay[hidden]{display:none}
.bchar.stretch{animation:bstretch 2.6s ease-in-out infinite}
.bchar.bend{animation:bbend 2.6s ease-in-out infinite}
.bchar.wiggle{animation:bwiggle .45s ease-in-out infinite}
.bchar.breathe{animation:bbreathe 4s ease-in-out infinite}
.bring{position:relative;width:clamp(90px,18vmin,150px);aspect-ratio:1}
.bring svg{width:100%;height:100%}
.bring span{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(22px,5vmin,34px) var(--f-display);color:var(--ink)}
@keyframes bstretch{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.28)}}
@keyframes bbend{0%,100%{transform:rotate(0)}50%{transform:rotate(38deg) scale(.95)}}
@keyframes bwiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes bbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.celebrate .hero svg.blk{width:clamp(100px,24vmin,230px)}
.celebrate .hero svg.stack{--k:1.3}
.hero2{animation:bounce 1.3s ease-in-out infinite .2s}
.slot2{position:relative;aspect-ratio:1;border-radius:22px;background:#fff;display:grid;place-items:center;transform:rotate(var(--r,0deg))}
.slot2 .em,.stab .em,.stkart .em{font-family:var(--f-emoji);line-height:1}
.slot2 .em{font-size:clamp(34px,10vmin,96px)}
.slot2.got{box-shadow:0 0 0 5px #fff,0 8px 0 5px var(--sky2)}
.slot2.got.shiny{box-shadow:0 0 0 5px #FFE08A,0 0 20px 4px #FFC928aa,0 8px 0 5px var(--sky2)}
.slot2.got.shiny::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffffcc 50%,transparent 65%);background-size:250% 100%;animation:shine 2.8s linear infinite}
.slot2.big{width:clamp(96px,22vmin,190px)}
.slot2.big .em{font-size:clamp(54px,13vmin,120px)}
.slot2.empty{background:#ffffff80;border:4px dashed var(--sky2);transform:none}
.slot2.empty .em{filter:brightness(0);opacity:.1}
.slot2.fresh{animation:pop .8s}
.slot2 .cnt{position:absolute;right:6px;bottom:4px;font:800 13px var(--f-display);color:var(--muted);font-style:normal}
.slot2 .new{position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;font:800 12px var(--f-display);border-radius:10px;padding:2px 7px;font-style:normal;z-index:2}
.stabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.stab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 8px;border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--sky2);min-width:clamp(44px,8vmin,64px)}
.stab .em{font-size:clamp(22px,5vmin,36px)}
.stab small{font:700 11px var(--f-body);color:var(--muted)}
.stab.on{background:var(--yellow);box-shadow:0 4px 0 #C79A0B}
.stab.on small{color:var(--ink)}
.sbook{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 2px 14px}
.spage{width:min(100%,860px);display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,2.6vmin,26px);padding:clamp(16px,3.4vmin,32px);border-radius:28px;background:color-mix(in srgb,var(--pg) 16%,#fff);box-shadow:0 8px 0 var(--sky2)}
.mhint{color:var(--muted);text-align:center;max-width:620px}
.stkart{gap:0}
.stkart .em{font-size:clamp(34px,9vmin,80px)}
.stkart .em.ghost{opacity:.4;filter:grayscale(1)}
@keyframes shine{from{background-position:150% 0}to{background-position:-50% 0}}
.home .card .glyph.sm{font-size:clamp(26px,5.6vmin,64px);white-space:nowrap}
.hellorow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello{font-size:clamp(30px,9vmin,76px);font-weight:700;text-align:center}
.cards{flex:1;min-height:0;display:grid;gap:clamp(12px,2.4vmin,20px);grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));align-content:safe center;overflow-y:auto;padding-bottom:12px}
.card{position:relative;border-radius:30px;background:var(--c);box-shadow:0 10px 0 var(--cd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px 10px;min-height:clamp(140px,28vmin,340px);color:#fff;font-family:var(--f-display);font-weight:700;transition:transform .12s}
.card:active{transform:translateY(6px);box-shadow:0 4px 0 var(--cd)}
.card .art{display:flex;align-items:flex-end;justify-content:center;gap:8px;min-height:clamp(60px,15vmin,160px)}
.card .art{max-width:100%;overflow:hidden;padding:0 6px}
.card .art svg.stack{width:calc(var(--u)*var(--k,1)*.75)}
.card .art svg.blk{width:clamp(50px,11vmin,120px)}
.card .glyph{font-family:var(--f-display),var(--f-emoji);font-size:clamp(44px,13vmin,120px);line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.18);text-align:center}
.card .glyph.xs{font-size:clamp(24px,5.6vmin,56px);white-space:nowrap}
.card{overflow:hidden;min-width:0}
.card .glyph.sm{font-size:clamp(36px,10vmin,84px)}
.card.locked{filter:grayscale(.85) brightness(1.05);opacity:.7}
.card .lockmark{position:absolute;top:10px;right:12px;width:34px;height:34px}
.lvl{display:flex;gap:6px}
.lvl i{width:16px;height:16px;border-radius:50%;background:#ffffff66;border:3px solid #fff}
.lvl i.f{background:#fff}
.gear{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:#ffffffaa;display:grid;place-items:center;opacity:.55;touch-action:none}
.gear svg{width:30px;height:30px;grid-area:1/1}
.gear .ring{fill:none;stroke:var(--purple);stroke-width:4;stroke-dasharray:138;stroke-dashoffset:138;transform:rotate(-90deg);transform-origin:center}
.gear.holding .ring{animation:ring 2.5s linear forwards}
.gear.holding{opacity:1}

.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,4vmin,30px);text-align:center}
.logo{font-family:var(--f-display);font-weight:700;font-size:clamp(46px,13vmin,100px);line-height:1;color:var(--ink)}
.logo b{color:var(--red)} .logo i{color:var(--blue);font-style:normal}
.bigplay{width:clamp(130px,30vmin,230px);height:clamp(130px,30vmin,230px);border-radius:50%;background:var(--green);box-shadow:0 12px 0 #2E8F34;display:grid;place-items:center}
.bigplay:active{transform:translateY(7px);box-shadow:0 5px 0 #2E8F34}
.bigplay svg{width:50%;height:50%;margin-left:8%}
.row.cast{align-items:flex-end}

.celebrate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;position:relative;overflow:hidden}
.stars{display:flex;gap:8px}
.stars svg{width:clamp(40px,10vmin,66px);height:auto}
.stars svg.pop{animation:pop .6s both}
.hero{animation:bounce 1.1s ease-in-out infinite}
.hero svg.blk{width:clamp(130px,32vmin,300px)}
.hero svg.stack{--k:1.6}
.hero .lock{font-size:80px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:14px;height:14px;border-radius:4px;animation:fall linear forwards}
.actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.actions .round{width:clamp(70px,14vmin,100px);height:clamp(70px,14vmin,100px)}
.badge{display:inline-block;background:var(--yellow);color:var(--ink);border-radius:20px;padding:4px 16px;font-family:var(--f-display);font-weight:700;font-size:clamp(20px,4.5vmin,30px);box-shadow:0 4px 0 #C79A0B}

.collection{flex:1;min-height:0;overflow-y:auto;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(30%,120px),1fr));align-content:start;padding:4px 2px 14px}
.cell{aspect-ratio:1;border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--sky2);display:flex;align-items:flex-end;justify-content:center;padding:8px;overflow:hidden}
.cell.lock{background:#ffffff77;box-shadow:none;align-items:center;font-family:var(--f-display);font-size:44px;color:var(--sky2)}
.cell svg.blk{width:70%}
.cell svg.stack{width:78%;--k:0;max-height:100%}
.cell:active{transform:scale(.95)}

.parent{flex:1;min-height:0;overflow-y:auto;font-size:17px;padding-bottom:30px}
.parent h2{font-size:30px;margin-bottom:6px}
.parent section{background:#fff;border-radius:20px;padding:16px;margin:12px 0;display:flex;flex-direction:column;gap:10px}
.parent h3{margin:0;font-family:var(--f-display);font-size:20px}
.parent label{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.parent input[type=text],.parent select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--sky2);background:#fff;color:var(--ink);min-width:0;max-width:100%}
.parent .btn{background:var(--blue);color:#fff;border-radius:12px;padding:10px 16px;font-weight:800}
.parent .btn.danger{background:var(--red)}
.parent .btn.ghost{background:var(--sky);color:var(--ink)}
.parent small{color:var(--muted)}
.snd{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.snd button{border-radius:12px;background:var(--sky);padding:10px 0;font:700 20px var(--f-display);position:relative}
.snd button.has{background:var(--green);color:#fff}
.snd button.rec{background:var(--red);color:#fff;animation:hint .5s infinite alternate}
table{border-collapse:collapse;width:100%;font-size:15px}
.tw{overflow-x:auto}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--sky)}

@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes hint{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-18px) rotate(2deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes ring{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<div id="app"></div>
<input type="file" id="sndfile" accept="audio/*" hidden>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

let voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return null;
  const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  if(S.voice){const f=vs.find(v=>v.voiceURI===S.voice);if(f)return voice=f}
  for(const p of ['Samantha','Aria','Jenny','Google US English','Zira','Karen','Google UK English Female']){const f=vs.find(v=>v.name.includes(p));if(f)return voice=f}
  return voice=vs.find(v=>/en-US/i.test(v.lang))||vs[0]||null;
}

/* Natural voice: pre-made clips (clips.json) are joined together; any text they can't cover falls back to the browser voice. */
let CLIPS=null;const BUF={};let curSrc=null;
fetch('clips.json').then(r=>r.ok?r.json():null).then(j=>{CLIPS=j}).catch(()=>{});
function getCtx(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
async function clipBuf(key){
  if(BUF[key]!==undefined)return BUF[key];
  if(!CLIPS||!CLIPS[key])return BUF[key]=null;
  try{
    const bin=atob(CLIPS[key]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const buf=await getCtx().decodeAudioData(u.buffer),d=buf.getChannelData(0),th=.012;
    let s=0,e=d.length-1;while(s<e&&Math.abs(d[s])<th)s++;while(e>s&&Math.abs(d[e])<th)e--;
    const pad=Math.floor(buf.sampleRate*.02);s=Math.max(0,s-pad);e=Math.min(d.length-1,e+pad);
    return BUF[key]={buf,off:s/buf.sampleRate,dur:(e-s)/buf.sampleRate};
  }catch(err){return BUF[key]=null}
}
async function playClip(key){
  const c=await clipBuf(key);if(!c)return false;
  return new Promise(res=>{const src=getCtx().createBufferSource();src.buffer=c.buf;src.connect(ac.destination);
    curSrc={src,res};src.onended=()=>{curSrc=null;res(true)};src.start(0,c.off,c.dur)});
}
function clipPlan(text){
  if(!CLIPS)return null;
  const t=text.toLowerCase().replace(/\d+/g,m=>+m<=100?numWords(+m):m).replace(/[’]/g,"'"),words=[];
  t.replace(/([a-z0-9'\-]+)([,.!?]*)/g,(m,w,p)=>{words.push({w,p:!!p})});
  const plan=[];let i=0;
  while(i<words.length){
    let hit=false;
    for(let j=Math.min(words.length,i+8);j>i;j--){
      const k=words.slice(i,j).map(x=>x.w).join(' ');
      if(CLIPS[k]){plan.push(k,words[j-1].p?.25:.03);i=j;hit=true;break}
    }
    if(!hit)return null;
  }
  return plan;
}
async function speak(text,my){
  const plan=clipPlan(text);
  if(plan){for(const p of plan){if(my!==undefined&&my!==sayTok)return;if(typeof p==='number')await wait(p*1000);else await playClip(p)}return}
  return ttsSpeak(text);
}
function ttsSpeak(text){return new Promise(res=>{
  if(!('speechSynthesis' in window)){res();return}
  const u=new SpeechSynthesisUtterance(text);
  if(voice||pickVoice()){u.voice=voice;u.lang=voice.lang}else u.lang='en-US';
  u.rate=S.rate;u.pitch=1.1;
  let done=false,t;const fin=()=>{if(!done){done=true;clearTimeout(t);res()}};
  u.onend=fin;u.onerror=fin;t=setTimeout(fin,2000+text.length*130);
  try{speechSynthesis.speak(u)}catch(e){fin()}
})}
let sayTok=0,curAudio=null;
function stopSay(){sayTok++;duck(false);try{speechSynthesis.cancel()}catch(e){}if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}
  if(curSrc){const c=curSrc;curSrc=null;c.src.onended=null;try{c.src.stop()}catch(e){}c.res(false)}}
function playRec(url){return new Promise(res=>{const a=new Audio(url);curAudio=a;a.onended=a.onerror=()=>res();a.play().catch(()=>res())})}
async function sayParts(parts){
  stopSay();const my=sayTok;duck(true);await wait(40);
  for(const p of parts){
    if(my!==sayTok)return;
    if(typeof p==='number'){await wait(p);continue}
    if(p.sound){const l=p.sound.toLowerCase();if(S.rec[l])await playRec(S.rec[l]);else if(!(await playClip('snd_'+l)))await ttsSpeak(PHON[l]);continue}
    await speak(p,my);
  }
  if(my===sayTok)duck(false);
}

function mNote(f,t,d,type,vol){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g);g.connect(mGain);o.start(t);o.stop(t+d+.05);
}
function mKick(t){
  const o=ac.createOscillator(),g=ac.createGain();o.type='sine';
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);
  o.connect(g);g.connect(mGain);o.start(t);o.stop(t+.25);
}
function mHit(t,d,vol,type,freq){
  if(!mNoiseBuf){mNoiseBuf=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);const a=mNoiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=mNoiseBuf;f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(g);g.connect(mGain);s.start(t);s.stop(t+d+.02);
}
function mTick(){
  if(!ac||ac.state!=='running')return;
  if(mNext<ac.currentTime)mNext=ac.currentTime+.05;
  while(mNext<ac.currentTime+.5){
    const bar=BARS[Math.floor(mStep/8)%BARS.length],i=mStep%8,t=mNext;
    if(i===0||i===4)mKick(t);
    if(i===2||i===6)mHit(t,.12,.22,'bandpass',1800);
    if(i%2===1)mHit(t,.05,.1,'highpass',7000);
    const bass=[0,0,12,7,0,0,12,7][i];
    if(i!==1&&i!==5)mNote(mf(bar.r+bass),t,.2,'triangle',.4);
    if(i===2||i===6)bar.c.forEach(n=>mNote(mf(n),t,.16,'triangle',.07));
    const n=bar.m[i];
    if(n){mNote(mf(n),t,.34,'triangle',.45);mNote(mf(n+12),t,.14,'sine',.1)}
    mNext+=M_STEP;mStep++;
  }
}
function startMusic(){
  if(!S.music||mTimer)return;
  try{
    getCtx();
    if(!mGain){
      mGain=ac.createGain();mGain.gain.value=musicLevel();
      const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;
      mGain.connect(lp);lp.connect(ac.destination);
    }
    mNext=ac.currentTime+.1;mTimer=setInterval(mTick,120);
  }catch(e){}
}
function stopMusic(){clearInterval(mTimer);mTimer=null}
function applyMusic(){if(mGain&&ac)mGain.gain.setTargetAtTime(musicLevel(),ac.currentTime,.15)}

function stackSVG(n,{col=0,face=true,take=0}={}){
  n=Math.max(1,n);const cell=22,gap=2,cols=Math.min(n,5),rows=Math.ceil(n/5);
  const W=cols*(cell+gap)+gap,H=rows*(cell+gap)+gap;const [c,cd]=pal(col);let g='';
  for(let i=0;i<n;i++){
    const r=Math.floor(i/5),x=gap+(i%5)*(cell+gap),y=H-(r+1)*(cell+gap);
    const gone=i>=n-take;
    g+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="4" fill="${c}" stroke="${cd}" stroke-width="1.5" ${gone?'opacity=".3" stroke-dasharray="3 2"':''}/>`;
    if(!gone)g+=`<rect x="${x+3}" y="${y+3}" width="${cell-6}" height="4" rx="2" fill="#fff" opacity=".28"/>`;
    else g+=`<path d="M${x+5} ${y+5}L${x+cell-5} ${y+cell-5}M${x+cell-5} ${y+5}L${x+5} ${y+cell-5}" stroke="#B83A30" stroke-width="3" stroke-linecap="round"/>`;
  }
  if(face&&n-take>0){
    const f=rows>1?1.35:1;const cx=W/2,cy=rows>1?H-gap-cell-gap/2:H-gap-cell/2;
    const ex=cell*.27*f,er=cell*.2*f,pr=cell*.1*f;
    const v=(n-1)%3,arc=(x)=>`<path d="M${x-er} ${cy-1*f}Q${x} ${cy-er*2.1} ${x+er} ${cy-1*f}" fill="none" stroke="#1B2A55" stroke-width="1.6" stroke-linecap="round"/>`;
    const round=(x)=>`<ellipse class="eye" cx="${x}" cy="${cy-2*f}" rx="${er}" ry="${er*1.1}" fill="#fff"/><circle cx="${x+1}" cy="${cy-1.5*f}" r="${pr}" fill="#1B2A55"/>`;
    const eyes=v===0?round(cx-ex)+round(cx+ex):v===1?arc(cx-ex)+arc(cx+ex):round(cx-ex)+arc(cx+ex);
    const mouth=v===1?`<path d="M${cx-3.5*f} ${cy+3.5*f}Q${cx} ${cy+9*f} ${cx+3.5*f} ${cy+3.5*f}z" fill="#7A1F2B"/>`:`<path d="M${cx-4*f} ${cy+4.5*f}q${4*f} ${4*f} ${8*f} 0" fill="none" stroke="#1B2A55" stroke-width="1.6" stroke-linecap="round"/>`;
    g+=`<g>${eyes}${mouth}</g>`;
  }
  return `<svg class="stack" style="--k:${(W/(cell+gap)).toFixed(2)}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}</svg>`;
}

const uniqueNear=(ans,n,lo,hi,spread)=>{
  const s=new Set([ans]);let guard=0;
  while(s.size<n&&guard++<80){const v=ans+(rnd(spread*2+1)-spread);if(v>=lo&&v<=hi)s.add(v)}
  for(let v=lo;s.size<n&&v<=hi;v++)s.add(v);
  return shuffle([...s]);
};

 nseq(lv,fixed){

function resample(pts,step=3){

    carry=len-(d-step);

  if(Math.hypot(last[0]-e[0],last[1]-e[1])>step*.4)out.push(last);else out[out.length-1]=last;
  return out;
}

const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function recStat(id,key,ok){

  const it=a.items[key]||(a.items[key]={n:0,ok:0});it.n++;if(ok)it.ok++;it.t=Date.now();

function prettyKey(id,k){
  switch(id){
   case 'nadd':return k.replace('+',' + ');
   case 'nsub':return k.replace('-',' − ');
   case 'nmult':{if(k[0]==='g'){const [g,s]=k.slice(2).split('x');return `${g} groups of ${s}`}return `Counting by ${k.split(':')[1]}s`}
   case 'nseq':{const [m,st,step]=k.split(':');return m==='n'?`What comes after ${+st+2*+step}`:m==='b'?`What comes before ${st}`:`Missing number near ${st}`}

const itemStat=(ids,key)=>{let n=0,ok=0;for(const id of ids){const it=S.act[id]&&S.act[id].items&&S.act[id].items[key];if(it){n+=it.n;ok+=it.ok}}return {n,ok}};
const heatColor=(n,ok)=>!n?['#E6ECF7','#7F8CAD']:n===1&&!ok?['#FFE29A','#6B4F00']:ok/n>=.8?['#BDEBBB','#1E5B22']:ok/n>=.5?['#FFE29A','#6B4F00']:['#FFB4AD','#7A1F18'];
const heatCell=(label,st)=>{const [bg,fg]=heatColor(st.n,st.ok);return `<div class="hm" style="background:${bg};color:${fg}" title="${st.n?st.ok+' of '+st.n+' right first time':'not seen yet'}"><b>${esc(label)}</b><small>${st.n?st.ok+'/'+st.n:'–'}</small></div>`};

function progressData(){
  const ids=Object.keys(ACT_NAME);let asked=0,correct=0,rounds=0;
  ids.forEach(id=>{const a=A(id);asked+=a.asked;correct+=a.correct;rounds+=a.rounds});
  const days=S.days||{},played=Object.keys(days).filter(k=>days[k].q>0).length;
  let streak=0;const d=new Date();if(!(days[dayKey(d)]&&days[dayKey(d)].q))d.setDate(d.getDate()-1);

function suggestions(pd){

  <section><h3>Words she has built</h3>${chips('lword')}</section>
  <section><h3>Sight words</h3>${chips('lsight')}</section>
  <section><h3>Each activity</h3><div class="tw"><table><tr><th>Activity</th><th>Level</th><th>Rounds</th><th>Right first time</th><th>Last played</th></tr>${rows}</table></div>
   <div><button class="btn ghost" data-act="copy">Copy a summary to share</button></div></section>`;
}
function summaryText(){
  const pd=progressData();
  const lines=[`${S.name||'Child'}'s progress in Block Pals`,`${pd.asked} questions, ${pd.asked?Math.round(100*pd.correct/pd.asked):0}% right first time, ${pd.rounds} rounds, ${pd.played} days played, ${pd.streak} day streak.`,''];
  pd.ids.forEach(id=>{const a=A(id);lines.push(`${ACT_NAME[id]}: level ${a.level+1}/3, ${a.rounds} rounds, ${a.asked?Math.round(100*a.correct/a.asked)+'%':'no answers yet'}`)});
  if(pd.hard.length){lines.push('','Hardest right now:');pd.hard.slice(0,8).forEach(h=>lines.push(`- ${prettyKey(h.id,h.k)}: ${h.ok} of ${h.n} right first time`))}
  return lines.join('\n');
}
function settingsHTML(){
  const voices=('speechSynthesis' in window?speechSynthesis.getVoices():[]).filter(v=>/^en/i.test(v.lang));
  return `<section><h3>Child</h3>
   <label for="pName">Name <input type="text" id="pName" value="${esc(S.name)}" maxlength="20" autocomplete="off"></label>
   <label for="pHints"><input type="checkbox" id="pHints" ${S.hints?'checked':''}> Give gentle hints when she pauses (repeats the question, then hides wrong answers, then shows the right one)</label>
   <label for="pBreak">Break reminder <select id="pBreak">${[[0,'Off'],[10,'After 10 minutes of play'],[15,'After 15 minutes of play'],[20,'After 20 minutes of play'],[30,'After 30 minutes of play']].map(([v,t])=>`<option value="${v}" ${S.breakMin===v?'selected':''}>${t}</option>`).join('')}</select></label>
   <label for="pBreakLen">Break length <select id="pBreakLen">${[1,2,3,5].map(v=>`<option value="${v}" ${S.breakLen===v?'selected':''}>${v} minute${v>1?'s':''}</option>`).join('')}</select></label>
   <div><button class="btn ghost" data-act="breaknow">Show the break screen now</button> <small>The break waits for the end of a round, never interrupts a question, and only counts time she is actually playing. Hold the gear on the break screen to end it early.</small></div>
   <label for="pUnlock"><input type="checkbox" id="pUnlock" ${S.unlockAll?'checked':''}> Open every activity now (otherwise each one opens after the one before)</label></section>
  <section><h3>Music</h3>
   <label for="pMusic"><input type="checkbox" id="pMusic" ${S.music?'checked':''}> Play background music</label>
   <label for="pMVol">Volume <input type="range" id="pMVol" min="0.1" max="1" step="0.05" value="${S.musicVol}"></label></section>
  <section><h3>Voice</h3>
   <small>${CLIPS?'The natural voice is loaded. The settings below only apply if it is not.':'The natural voice did not load, so the game is using this device\'s own voice.'}</small>
   <label for="pVoice">Voice <select id="pVoice"><option value="">Automatic</option>${voices.map(v=>`<option value="${esc(v.voiceURI)}" ${S.voice===v.voiceURI?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label>
   <label for="pRate">Speed <input type="range" id="pRate" min="0.6" max="1.1" step="0.05" value="${S.rate}"></label>
   <div><button class="btn ghost" data-act="testvoice">Test voice</button></div></section>
  <section><h3>Letter sounds</h3><small>Tap a letter to record it (needs microphone permission; may not work when opened from a link), or choose a short audio file under 250 KB. Letters without a recording use the computer voice. Green means recorded.</small>
   <div class="snd">${AZ.map(L=>`<button class="${recState===L?'rec':S.rec[L.toLowerCase()]?'has':''}" data-act="snd" data-arg="${L}">${L}</button>`).join('')}</div>
   <div><button class="btn ghost" data-act="sndfile">Choose a file for the last letter tapped</button> <button class="btn ghost" data-act="sndclear">Remove all recordings</button></div></section>
  <section><h3>Starting level</h3><small>${S.placed?'The quick game has been played or skipped.':'The quick game has not been played yet.'} It sets each activity's level from a few questions. Playing it again replaces her current levels.</small>
   <div><button class="btn ghost" data-act="quizredo">Play the quick game again</button></div></section>
  <section><h3>Reset</h3>${storageOk?'':'<small>This browser is not saving progress right now.</small>'}<div><button class="btn danger" id="resetBtn" data-act="reset">Reset all progress</button></div></section>`;
}
function screenParent(msg=''){
  stopSay();
  render(`<div class="parent"><div class="topbar">${ibtn('home',ICON.home,'Home')}<h2>Grown-ups</h2></div>
  <div class="ptabs"><button class="ptab ${pTab==='progress'?'on':''}" data-act="ptab" data-arg="progress">Progress</button><button class="ptab ${pTab==='settings'?'on':''}" data-act="ptab" data-arg="settings">Settings</button></div>
  ${msg?`<section style="background:#FFF3C4"><span>${esc(msg)}</span>${msg.startsWith('Copy this')?`<textarea readonly id="copybox" rows="8">${esc(summaryText())}</textarea>`:''}</section>`:''}
  ${pTab==='progress'?progressHTML():settingsHTML()}</div>`);
}
let lastSnd='A',resetArm=0;
async function recordLetter(L){
  lastSnd=L;
  if(recState){if(recStop)recStop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){screenParent('Recording is not available here. Use "Choose a file" instead.');return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const mr=new MediaRecorder(st),chunks=[];recState=L;
    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());recState=null;recStop=null;
      const fr=new FileReader();fr.onload=()=>storeRec(L,fr.result,new Blob(chunks).size);fr.readAsDataURL(new Blob(chunks,{type:mr.mimeType}))};
    recStop=()=>mr.stop();mr.start();screenParent(`Recording ${L}… tap ${L} again to stop (it stops by itself after 2 seconds).`);
    setTimeout(()=>{if(recStop)recStop()},2000);
  }catch(e){recState=null;recStop=null;screenParent('The microphone is not available here. Use "Choose a file" instead.')}
}
function storeRec(L,url,size){
  if(size>250*1024){screenParent('That clip is too big. Keep each sound under 250 KB.');return}
  S.rec[L.toLowerCase()]=url;save();
  if(!storageOk){delete S.rec[L.toLowerCase()];screenParent('There was no room to save that sound.');return}
  screenParent(`Saved the sound for ${L}.`);playRec(url);
}
$('#sndfile').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const fr=new FileReader();fr.onload=()=>storeRec(lastSnd,fr.result,f.size);fr.readAsDataURL(f);
});

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,arg=t.dataset.arg;
  switch(act){
   case 'setup-save':S.name=$('#nameIn').value.trim();save();screenSplash();break;
   case 'start':getCtx();startMusic();sfx.pop();if(!S.placed){screenQuizIntro();break}screenHome();sayParts(['Hi!','What shall we play?']);break;
   case 'home':R=null;screenHome();break;
   case 'quizgo':startQuiz();break;
   case 'quizskip':S.placed=true;save();screenHome();sayParts(['Hi!','What shall we play?']);break;
   case 'quizredo':screenQuizIntro();break;
   case 'stickers':screenStickers();break;
   case 'spage':spage=+arg;screenStickers(true);break;
   case 'stk':{sfx.pop();t.animate&&t.animate([{transform:'scale(1)'},{transform:'scale(1.18) rotate(6deg)'},{transform:'scale(1)'}],{duration:420});break}
   case 'breakend':endBreak();sayParts(['Hi!','What shall we play?']);break;
   case 'breaknow':screenBreak();break;
   case 'ptab':pTab=arg;screenParent();break;
   case 'copy':{const txt=summaryText(),fail=()=>screenParent('Copy this text by hand:');try{navigator.clipboard.writeText(txt).then(()=>screenParent('Copied. You can paste it into a message.'),fail)}catch(e){fail()}break}
   case 'music':S.music=!S.music;save();if(S.music)startMusic();else stopMusic();screenHome();break;
   case 'menu':screenMenu(arg);break;
   case 'menu-back':screenMenu(menuOf);break;
   case 'blocks':screenBlocks();break;
   case 'locked':t.style.animation='shake .4s';setTimeout(()=>t.style.animation='',420);sayParts(['Finish the one before first!']);break;
   case 'play':menuOf=t.dataset.menu||menuOf;startRound(arg);break;
   case 'again':startRound(arg);break;
   case 'leave':{const wasQuiz=R&&R.quiz;R=null;if(wasQuiz)screenHome();else screenMenu(menuOf);break}
   case 'replay':if(R&&R.cur)sayParts(R.cur.say);break;
   case 'ans':answer(+t.dataset.i);break;
   case 'btile':buildTile(t);break;
   case 'count':countObj(t);break;
   case 'hello':{const w=nameOf(arg);sayParts(w.say);t.animate&&t.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:400});break}
   case 'testvoice':sayParts(["Hello! Let's learn some letters and numbers.",{sound:'b'},{sound:'s'}]);break;
   case 'snd':recordLetter(arg);break;
   case 'sndfile':$('#sndfile').click();break;
   case 'sndclear':S.rec={};save();screenParent('Removed all recordings.');break;
   case 'reset':
     if(Date.now()-resetArm<4000){const keep=S.name;S=defaults();S.name=keep;save();screenParent('Progress reset.')}
     else{resetArm=Date.now();t.textContent='Tap again to confirm';setTimeout(()=>{const b=$('#resetBtn');if(b&&Date.now()-resetArm>=3900)b.textContent='Reset all progress'},4000)}
     break;
  }
});
app.addEventListener('pointerdown',()=>{if(R&&R.cur&&!R.lock)armHint()});
app.addEventListener('input',e=>{
  if(e.target.id==='pName'){S.name=e.target.value.trim();save()}
  if(e.target.id==='pRate'){S.rate=+e.target.value;save()}
  if(e.target.id==='pMVol'){S.musicVol=+e.target.value;save();applyMusic()}
});
app.addEventListener('change',e=>{
  if(e.target.id==='pUnlock'){S.unlockAll=e.target.checked;save()}
  if(e.target.id==='pHints'){S.hints=e.target.checked;save()}
  if(e.target.id==='pBreak'){S.breakMin=+e.target.value;save()}
  if(e.target.id==='pBreakLen'){S.breakLen=+e.target.value;save()}
  if(e.target.id==='pMusic'){S.music=e.target.checked;save();if(S.music)startMusic();else stopMusic()}
  if(e.target.id==='pVoice'){S.voice=e.target.value;voice=null;save()}
});
/* hold the gear for 2.5 s to open the grown-ups area */
let holdT=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('#gear');if(!g)return;
  g.classList.add('holding');holdT=setTimeout(()=>{g.classList.remove('holding');if(onBreak)endBreak();else{pTab='progress';screenParent()}},2500);
});
const cancelHold=()=>{clearTimeout(holdT);const g=$('#gear');if(g)g.classList.remove('holding')};
document.addEventListener('pointerup',cancelHold);document.addEventListener('pointercancel',cancelHold);
document.addEventListener('contextmenu',e=>{if(e.target.closest('#gear'))e.preventDefault()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopSay();try{ac&&ac.suspend()}catch(e){}}else{try{ac&&ac.resume()}catch(e){}}});

if(S.name)screenSplash();else screenSetup();
</script>
